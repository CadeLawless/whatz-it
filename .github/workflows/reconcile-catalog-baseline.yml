name: Reconcile Bundled Catalog Baseline

run-name: Reconcile catalog (${{ github.event.client_payload.correlation_id || inputs.correlation_id || format('reconcile-{0}-{1}', github.run_id, github.run_attempt) }})

on:
  repository_dispatch:
    types: [catalog-production-published]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Optional trace identifier for this manual recovery run
        required: false
        type: string

permissions: {}

concurrency:
  group: catalog-baseline-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile active public manifest
    if: >-
      github.event_name != 'repository_dispatch'
      || (github.event.client_payload.environment == 'production'
      && github.event.client_payload.status == 'succeeded')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CATALOG_RECONCILER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_RECONCILER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out main with the GitHub App identity
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Configure GitHub App commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Reconcile through the fixed bot pull request
        env:
          CATALOG_MANIFEST_URL: ${{ vars.CATALOG_MANIFEST_URL }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLICATION_CORRELATION_ID: ${{ github.event.client_payload.correlation_id || inputs.correlation_id || format('reconcile-{0}-{1}', github.run_id, github.run_attempt) }}
          PUBLICATION_ENVIRONMENT: ${{ github.event.client_payload.environment || '' }}
          PUBLICATION_STATUS: ${{ github.event.client_payload.status || '' }}
          PUBLISHED_REVISION: ${{ github.event.client_payload.published_revision || '' }}
          RECONCILIATION_TRIGGER: ${{ github.event_name == 'repository_dispatch' && 'publication' || github.event_name }}
        run: npm run catalog:baseline:reconcile
