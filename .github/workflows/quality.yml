name: Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Canonical quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_MANIFEST_URL: ${{ vars.CATALOG_MANIFEST_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical quality gate
        run: npm run quality
